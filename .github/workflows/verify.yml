name: Verify

on:
  push:
    branches: [master, phw]
    tags: ["v*"]
  pull_request:
    branches: [master, phw]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and production build
        run: npm run check

      - name: Build deployment image
        run: docker build -t hello-solar-planner:${{ github.sha }} .
